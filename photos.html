<!DOCTYPE html>
<html lang="en">
<head>
  <script data-goatcounter="https://marutator.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="images/icon.png">
  <link rel="icon" href="/images/icon.png" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/icon.png">
  <link rel="apple-touch-icon" href="/images/icon.png">

  <meta property="og:description" content="Applied Mathematics PhD student at Harvard. Deep learning theory.">

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mary Letey">
  <meta name="twitter:description" content="Applied Mathematics PhD student at Harvard. Deep learning theory.">
  <meta name="twitter:image" content="https://maryiletey.com/images/icon.png">

  <title>photos — Mary Letey</title>
  <meta name="author" content="Mary Letey" />
  <meta name="description" content="Applied Math PhD student at Harvard" />
  <meta name="color-scheme" content="light dark">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    (function () {
      const savedTheme = localStorage.getItem("theme");
      const systemPrefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : systemPrefersDark
            ? "dark"
            : "light";
    })();
  </script>

  <style>
  :root{
    --bg:#ffffff;
    --bg-glow-1: rgba(110, 115, 210, 0.10);
    --bg-glow-2: rgba(178, 151, 255, 0.08);
    --fg:#121333;
    --muted:#555675;
    --border:#E4E4EB;
    --soft:#F2F4FA;
    --link:#6166DC;
    --link-hover:#14142E;
    --radius: 16px;
    --hoverbg:#F2F4FA;
    --icon-accent:#6F73D2;
    --icon-accent-hover:#3E4299;
    --paper-title:#54568F;
    --paper-title-hover:#14142E;
    --button-bg: rgba(97, 102, 220, 0.08);
    --button-border: rgba(97, 102, 220, 0.18);
    --button-shadow: 0 12px 30px rgba(30, 32, 78, 0.08);
  }
  
   html[data-theme="dark"]{
      --bg: #0B0805;
      --bg-glow-1: rgba(139, 120, 211, 0.04);
      --bg-glow-2: rgba(91, 74, 129, 0.04);
      --fg:#E8E1EA;
      --muted:#A99FB0;
      --border:#2C2636;
      --soft:#1B1723;
      --link:#B7A1FF;
      --link-hover:#EFE9FF;
      --hoverbg:rgba(183, 161, 255, 0.10);
      --icon-accent:#B7A1FF;
      --icon-accent-hover:#EFE9FF;
      --paper-title:#E8E1EA;
      --paper-title-hover:#DACEDE;
      --button-bg: rgba(183, 161, 255, 0.08);
      --button-border: rgba(183, 161, 255, 0.20);
      --button-shadow: 0 16px 42px rgba(0, 0, 0, 0.22);
    }


  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:
      radial-gradient(circle at 12% 0%, var(--bg-glow-1), transparent 30rem),
      radial-gradient(circle at 88% 10%, var(--bg-glow-2), transparent 32rem),
      var(--bg);
    color:var(--fg);
    font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: clamp(16px, 0.6vw + 14px, 18px);
    line-height: 1.72;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.01em;
    transition: background-color 180ms ease, color 180ms ease;
  }

  p{ margin: 0 0 12px; }

  a{
    color:var(--link);
    text-decoration:none;
    border-radius: 6px;
    padding: 0 2px;
    transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease;
  }

  a:hover{
    color:var(--link-hover);
    background: var(--hoverbg);
    text-decoration:none;
  }

  main{
    max-width: 860px;
    margin: 0 auto;
    padding: clamp(32px, 5vw, 56px) 20px 72px;
  }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom: 18px;
  }

  .name-line{
    font-family: "Jura", sans-serif;
    margin: 0;
    font-size: clamp(24px, 1.4vw + 18px, 30px);
    letter-spacing: 0.02em;
  }

  .name-line b{ font-weight: 600; }

  .header-links{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .icons{
    list-style:none;
    padding:0;
    margin:0;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }

  .icons a{
    font-family: "Jura", sans-serif;
    font-weight: 500;
    padding: 6px;
    background: none;
  }

  .icons a .linkicon{
    width: 18px;
    height: 18px;
    fill: currentColor;
    opacity: 0.9;
    flex: 0 0 auto;
  }

  .icons a:hover{
    color: var(--icon-accent-hover);
    background: none;
    text-decoration: none;
  }

  .theme-toggle{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--button-border);
    background:var(--button-bg);
    color:var(--muted);
    border-radius:999px;
    width:32px;
    height:32px;
    padding:0;
    font-family:"Jura", sans-serif;
    cursor:pointer;
    box-shadow:var(--button-shadow);
    transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
  }

  .theme-toggle:hover{
    color:var(--link-hover);
    border-color:var(--link);
    transform:translateY(-1px);
  }

  .theme-toggle:focus-visible{
    outline:2px solid var(--link);
    outline-offset:3px;
  }

  .theme-toggle-icon{
    font-size:15px;
    line-height:1;
  }

  .intro{
    display:flex;
    gap:22px;
    align-items:flex-start;
    margin-top: 22px;
    flex-direction: row-reverse;
  }

  .intro p{
    font-size: 0.90em;
    line-height: 1.5;
  }

  .avatar{
    width: 140px;
    height: 140px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    object-fit: cover;
    flex: 0 0 auto;
    box-shadow: var(--button-shadow);
  }

  .section{
    margin-top: 26px;
  }

  .section h4{
    font-family: "Jura", sans-serif;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--link);
    margin: 30px 0 12px;
  }

  .paper{
    padding: 12px 0;
    margin: 0;
    border-top: 1px solid var(--border);
    background: transparent;
    border-radius: 0;
  }

  .paper:first-of-type{
    border-top: none;
  }

  .conf-tag{
    display:block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .paper-title{
    color: var(--paper-title);
    font-weight: 600;
    display: block;
    margin: 2px 0 6px;
    word-break: break-word;
  }

  .paper-title:hover{
    color: var(--paper-title-hover);
    text-decoration: underline;
    background: none;
  }

  .paper-meta{
    color: var(--muted);
    font-size: 14px;
  }

  .small{
    color: var(--muted);
    font-size: 13px;
  }

  .divider{
    height:1px;
    background:var(--border);
    margin: 28px 0;
  }

  .friends-section{
    margin-top: 34px;
  }

  .misc-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--paper-title);
    font-family: "Jura", sans-serif;
    font-size: clamp(20px, 1vw + 16px, 26px);
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 0;
    margin: 0 0 18px;
    background: none;
  }

  .misc-link:hover{
    color: var(--paper-title-hover);
    background: none;
    text-decoration: none;
  }

  .misc-icon{
    font-size: 0.92em;
    line-height: 1;
  }

  .friends-note{
    color: var(--muted);
    font-family: "Jura", sans-serif;
    font-size: clamp(20px, 1vw + 16px, 26px);
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0 0 12px;
  }

  .friend-list{
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    line-height: 1.7;
  }

  .friend-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--paper-title);
    font-size: 0.92em;
    padding: 0;
    border-radius: 0;
    background: none;
    white-space: nowrap;
  }

  .friend-link:hover{
    color: var(--paper-title-hover);
    background: none;
    text-decoration: none;
  }

  .friend-icon{
    font-size: 0.95em;
    line-height: 1;
    opacity: 0.85;
    display: inline-block;
    transform: translateY(-0.02em);
  }

  @media (max-width: 700px){
    header{
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .intro{
      display: grid;
      grid-template-columns: 1fr max-content;
      grid-template-rows: auto auto;
      column-gap: 14px;
      row-gap: 10px;
      align-items: start;
      margin-top: 12px;
      flex-direction: initial;
    }

    .intro .avatar{
      grid-column: 2;
      grid-row: 1;
      width: 110px;
      height: 110px;
      justify-self: end;
    }

    .intro > div{
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
    }

    .friend-list{
      gap: 7px 12px;
    }
  }

  @media (max-width: 420px){
    main{
      padding: 30px 14px 56px;
    }

    .icons{
      gap: 8px;
    }

    .intro{
      grid-template-columns: 1fr max-content;
    }

    .intro .avatar{
      width: 96px;
      height: 96px;
    }

  }

  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 26px;
    color: var(--muted);
    font-family: "Jura", sans-serif;
    font-weight: 600;
    padding: 0;
    background: none;
  }

  .back-link:hover{
    color: var(--link-hover);
    background: none;
  }

  .gallery-intro{
    color: var(--muted);
    font-size: 0.95em;
    margin: -2px 0 22px;
  }

  .photo-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-top: 18px;
  }

  .photo-card{
    margin: 0;
  }

  .photo-card img{
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--button-shadow);
    background: var(--soft);
  }

  .photo-card figcaption{
    color: var(--muted);
    font-size: 13px;
    margin-top: 7px;
  }

  </style>
</head>

<body>
  <main>
    <a class="back-link" href="/" aria-label="Back to homepage">← home</a>

    <header>
      <div>
        <p class="name-line"><a href="/"><b>photos</b></a></p>
      </div>

      <div class="header-links">
        <button class="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="true" title="Toggle light/dark theme">
          <span class="theme-toggle-icon" aria-hidden="true">☾</span>
        </button>
      </div>
    </header>

    <div class="section">
      <p class="gallery-intro">A small photo gallery. Add your images to <code>images/photos/</code>, then update the filenames and captions below.</p>

      <div class="photo-grid" aria-label="Photo gallery">
        <figure class="photo-card">
          <img src="images/photos/laussane.jpeg" alt="Laussane">
          <figcaption>photo 01</figcaption>
        </figure>
        <figure class="photo-card">
          <img src="images/photos/ball-square.jpg" alt="Nearby sky">
          <figcaption>photo 02</figcaption>
        </figure>
        <figure class="photo-card">
          <img src="images/photos/harvard-yard.jpeg" alt="A special sunset">
          <figcaption>photo 03</figcaption>
        </figure>
        <figure class="photo-card">
          <img src="images/photos/hbs-friend.JPG" alt="Business friend">
          <figcaption>photo 04</figcaption>
        </figure>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const root = document.documentElement;
      const button = document.querySelector(".theme-toggle");
      const icon = document.querySelector(".theme-toggle-icon");
      const systemTheme = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

      function getSystemTheme() {
        return systemTheme && systemTheme.matches ? "dark" : "light";
      }

      function applyTheme(theme, savePreference) {
        root.dataset.theme = theme;
        const dark = theme === "dark";
        button.setAttribute("aria-pressed", String(dark));
        button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
        icon.textContent = dark ? "☾" : "☼";

        if (savePreference) {
          localStorage.setItem("theme", theme);
        }
      }

      applyTheme(root.dataset.theme || getSystemTheme(), false);

      if (systemTheme) {
        systemTheme.addEventListener("change", function (event) {
          if (!localStorage.getItem("theme")) {
            applyTheme(event.matches ? "dark" : "light", false);
          }
        });
      }

      button.addEventListener("click", function () {
        applyTheme(root.dataset.theme === "dark" ? "light" : "dark", true);
      });
    })();
  </script>
</body>
</html>
